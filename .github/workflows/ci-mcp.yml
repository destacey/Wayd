name: CI - MCP Server

on:
    push:
        branches:
            - main
        paths:
            - "Wayd.Web/src/Wayd.Mcp/**"
    pull_request:
        paths:
            - "Wayd.Web/src/Wayd.Mcp/**"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: Wayd.Web/src/Wayd.Mcp
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run typecheck

            - name: Build
              run: npm run build

            # test:only skips the rebuild — the Build step above already
            # produced the artifact the tests import from.
            - name: Test
              run: npm run test:only

    release-pr:
        needs: [build]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm ci
              working-directory: Wayd.Web/src/Wayd.Mcp

            - name: Open or update release PR
              uses: changesets/action@v1.5.1
              with:
                  cwd: Wayd.Web/src/Wayd.Mcp
                  # `changeset version` rewrites package.json but never runs an
                  # install, so package-lock.json keeps the old version and drifts
                  # a little further behind with every release. Refresh it here so
                  # the release PR carries the bump too. --package-lock-only skips
                  # node_modules, which the npm ci step above already populated.
                  version: npx changeset version && npm install --package-lock-only
                  title: "chore: release @wayd/mcp"
                  commit: "chore: version mcp package"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
