name: CI - MCP Server

on:
    push:
        branches:
            - main
        paths:
            - "Wayd.Web/src/Wayd.Mcp/**"
            # The test suite asserts the docs and skills match the tools that
            # ship, so editing either half has to run it. Without these, a row
            # deleted from the reference page triggers no workflow at all.
            - "docs/getting-started/mcp-server.mdx"
            - "skills/**"
    pull_request:
        paths:
            - "Wayd.Web/src/Wayd.Mcp/**"
            - "docs/getting-started/mcp-server.mdx"
            - "skills/**"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: Wayd.Web/src/Wayd.Mcp
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run typecheck

            - name: Build
              run: npm run build

            # test:only skips the rebuild — the Build step above already
            # produced the artifact the tests import from.
            - name: Test
              run: npm run test:only

    release-pr:
        needs: [build]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm ci
              working-directory: Wayd.Web/src/Wayd.Mcp

            - name: Open or update release PR
              uses: changesets/action@v1.5.1
              with:
                  cwd: Wayd.Web/src/Wayd.Mcp
                  # Runs the version-packages script, which follows `changeset
                  # version` with a lockfile refresh — that command never runs an
                  # install, so package-lock.json would otherwise keep the old
                  # version and drift further behind with every release.
                  # This input is split into argv rather than run through a shell,
                  # so it has to stay a single command: chaining with && here makes
                  # changesets reject the extra arguments.
                  version: npm run version-packages
                  title: "chore: release @wayd/mcp"
                  commit: "chore: version mcp package"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
