name: docker

on:
    workflow_dispatch:
    push:
        branches:
            - "main"
        tags:
            - "v*"
    pull_request:
        branches:
            - "main"

jobs:
    build-and-test-api:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
                working-directory: Wayd.Web/src/Wayd.Web.Api
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore -c Release

            # Generate the Wolverine handler tree (Internal/Generated/WolverineHandlers). It is NOT committed:
            # `codegen write` boots the freshly built app to emit the TypeLoadMode.Static handler code that the
            # integration tests and the shipped Docker image both run. This is the ONE generation per pipeline
            # run — the tree is uploaded as an artifact below and reused by the image build, so the tested tree
            # is byte-identical to the shipped tree (codegen output is DI-registration-order sensitive and not
            # reproducible across environments, so regenerating separately would risk drift).
            #
            # Env: ASPNETCORE_ENVIRONMENT=Development runs the codegen boot in Auto mode (no pre-existing tree
            # needed) and skips the production JWT-secret guard in AddLocalJwtAuth. WAYD_SKIP_DB_INIT + a
            # placeholder connection string let the host boot without a database (codegen never connects; the
            # `codegen write` verb builds the host but never calls app.Run(), so no hosted service runs).
            # OTEL_EXPORTER_OTLP_ENDPOINT is cleared so the OTLP exporter services do not perturb registration
            # order. The generated output is the same Static handler code regardless of the host's own mode.
            - name: Generate Wolverine handler tree
              env:
                  ASPNETCORE_ENVIRONMENT: Development
                  WAYD_SKIP_DB_INIT: "true"
                  OTEL_EXPORTER_OTLP_ENDPOINT: ""
                  # Placeholder connection string: codegen never opens a successful connection (WAYD_SKIP_DB_INIT
                  # skips migrations/seeding and the `codegen write` verb never calls app.Run()). It must be a
                  # syntactically valid SQL Server string on THIS runner though — a `(localdb)` data source throws
                  # PlatformNotSupportedException at parse time on Linux, so use a plain unreachable TCP host.
                  DatabaseSettings__ConnectionString: "Server=127.0.0.1,1433;Database=Codegen;User Id=sa;Password=Not_used_by_codegen_1;TrustServerCertificate=true;Connect Timeout=1"
                  HangfireSettings__Storage__ConnectionString: "Server=127.0.0.1,1433;Database=Codegen;User Id=sa;Password=Not_used_by_codegen_1;TrustServerCertificate=true;Connect Timeout=1"
              run: dotnet run --no-build --no-launch-profile -c Release -- codegen write

            # Share the freshly generated tree with the image build so it ships the exact tree that was tested.
            - name: Upload Wolverine handler tree
              uses: actions/upload-artifact@v4
              with:
                  name: wolverine-handler-tree
                  path: Wayd.Web/src/Wayd.Web.Api/Internal/Generated/WolverineHandlers/
                  if-no-files-found: error
                  retention-days: 1

            # Every test project that does not need Docker, run BEFORE the Testcontainers suites below.
            # dotnet-test-projects.sh owns the split and derives it from Wayd.slnx, so a new test project joins
            # a side automatically. Ordering matters: a step that fails ends the job, so a unit-test failure is
            # reported without ever starting a SQL Server container.
            #
            # Wayd.Integrations.AzureDevOps.IntegrationTests runs HERE despite the name: it needs a live Azure
            # DevOps org (OrganizationUrl + PAT from a developer's config, absent in CI), not Docker, and skips
            # itself via Assert.SkipUnless (see OptionsFixture.IsConfigured).
            #
            # Coverage is collected only on the main-branch build (see the coverage job): instrumentation
            # slows the run, and a PR gets no report from it, so PRs keep the faster uninstrumented path.
            - name: Test (unit + architecture)
              working-directory: .
              env:
                  COLLECT_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
              run: bash .github/scripts/dotnet-test-projects.sh unit

            # The Testcontainers suites, in the SAME job as the unit tests above rather than a parallel one.
            # A separate job has to repeat this job's restore and build before it can run a test -- 132s on the
            # runner, against ~171s of actual integration testing -- and it cannot start until this job has
            # published the Wolverine handler tree, so the two run effectively in series anyway. Sharing one
            # build is both simpler and faster; the tests here already boot the tree this job just generated.
            #
            # Spins up SQL Server via Testcontainers on the runner's preinstalled Docker; Ryuk (the resource
            # reaper) stays enabled, per Testcontainers' guidance for GitHub Actions.
            - name: Test (integration)
              working-directory: .
              env:
                  COLLECT_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
              run: bash .github/scripts/dotnet-test-projects.sh integration

            # One artifact for both halves: coverage-report merges whatever Cobertura it finds under this
            # directory, and both test runs write into the same TestResults tree.
            - name: Upload .NET coverage
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-dotnet
                  path: "**/TestResults/**/coverage.cobertura.xml"
                  if-no-files-found: error
                  retention-days: 1

    build-and-test-client:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
                working-directory: Wayd.Web/src/wayd.web.reactclient
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: npm ci
              run: npm ci

            - name: npm run lint
              run: npm run lint

            # Runs before build so a type error fails fast with a direct tsc message rather than
            # surfacing later inside the slower Next build.
            - name: npm run typecheck
              run: npm run typecheck

            - name: npm run build
              run: npm run build

            # Coverage instrumentation costs roughly 4x the test run itself (v8 provider over the whole
            # source tree), and a PR publishes no coverage report, so PRs run the tests without it. The
            # main-branch build collects coverage and uploads it alongside the .NET report.
            - name: npm test
              if: github.event_name != 'push' || github.ref != 'refs/heads/main'
              run: npm run test:ci

            - name: npm run test:coverage
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              run: npm run test:coverage

            # Only lcov.info is uploaded: it is what coverage-report parses, and the sibling artefacts are
            # large and redundant (coverage-final.json and clover.xml are several MB each, and lcov-report is
            # a full HTML tree that coverage-report regenerates anyway).
            #
            # if-no-files-found: error, not warn — this step only runs on the main-branch push where the
            # coverage step above also ran, so a missing file means that step silently produced nothing
            # rather than that coverage was legitimately skipped.
            - name: Upload client coverage
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-client
                  path: Wayd.Web/src/wayd.web.reactclient/coverage/lcov.info
                  if-no-files-found: error
                  retention-days: 14

    # Merges the Cobertura files from BOTH test jobs into one report. Merging matters: the unit suites and
    # the Testcontainers suites cover different code (integration tests exercise the dispatch and persistence
    # paths unit tests deliberately mock), so either half alone understates real coverage.
    #
    # main-branch pushes only -- PRs never collect coverage, so there is nothing to merge there, and the job
    # would find no artifacts. Never gates the build: this reports a number, it does not enforce one.
    coverage-report:
        runs-on: ubuntu-latest
        needs: [build-and-test-api, build-and-test-client]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            # Every coverage artifact lands under coverage/, one subdirectory per uploading job:
            # coverage-dotnet holds Cobertura from both .NET halves, coverage-client holds Jest's lcov.
            - name: Download coverage artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: coverage-*
                  path: coverage

            - name: Install ReportGenerator
              run: dotnet tool install --global dotnet-reportgenerator-globaltool

            # Split into two invocations deliberately. The markdown summary + merged Cobertura take ~3s; the
            # per-class HTML takes minutes on a codebase this size (a page per class, thousands of them). Doing
            # the cheap one first means the run-page number is never held up by, or lost to, the slow one.
            - name: Merge coverage reports
              run: >-
                  reportgenerator
                  -reports:'coverage/coverage-dotnet/**/coverage.cobertura.xml'
                  -targetdir:coverage-report
                  -reporttypes:'Cobertura;MarkdownSummaryGithub'

            - name: Write .NET coverage summary
              run: |
                  echo '## .NET coverage' >> "$GITHUB_STEP_SUMMARY"
                  cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

            # Reported separately rather than merged into the .NET number. ReportGenerator will happily
            # combine them, but the result is a single blended percentage over two unrelated codebases, and
            # the client lands in it as an unnamed "Default" assembly next to the real ones. Two labelled
            # numbers say more than one averaged one.
            #
            # Jest writes lcov.info; ReportGenerator parses it directly, so nothing has to convert formats.
            - name: Generate client coverage summary
              run: >-
                  reportgenerator
                  -reports:'coverage/coverage-client/lcov.info'
                  -targetdir:coverage-report/client
                  -reporttypes:'MarkdownSummaryGithub'

            - name: Write client coverage summary
              run: |
                  echo '## Client coverage' >> "$GITHUB_STEP_SUMMARY"
                  cat coverage-report/client/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

            # Browsable drill-down. continue-on-error because it is a convenience artifact: the summary above
            # is already published, and a slow or failed render should not redden a green main build.
            - name: Generate browsable HTML report
              continue-on-error: true
              run: >-
                  reportgenerator
                  -reports:'coverage/coverage-dotnet/**/coverage.cobertura.xml'
                  -targetdir:coverage-report/html
                  -reporttypes:'HtmlInline_AzurePipelines'

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage-report/
                  retention-days: 14

    build-and-push-image:
        runs-on: ubuntu-latest
        needs: [build-and-test-api, build-and-test-client]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - dockerfile: ./Wayd.Web/src/Wayd.Web.Api/Dockerfile
                      image: awaldow/moda-api
                      contextDir: .
                    - dockerfile: ./Wayd.Web/src/wayd.web.reactclient/Dockerfile
                      image: awaldow/moda-client
                      contextDir: .
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # Bring in the Wolverine handler tree generated by build-and-test-api so the API image ships the
            # exact tree that was tested (see that job). Only the API image needs it; the client leg skips this.
            # The tree is git-ignored, so the Dockerfile COPY of the build context would otherwise find nothing.
            - name: Download Wolverine handler tree
              if: matrix.image == 'awaldow/moda-api'
              uses: actions/download-artifact@v4
              with:
                  name: wolverine-handler-tree
                  path: Wayd.Web/src/Wayd.Web.Api/Internal/Generated/WolverineHandlers/

            # Registry login and the push below are both gated on NOT being a pull_request. The job itself
            # stays ungated so it always builds (a broken Dockerfile still fails the PR) and always reports
            # success — `terraform` declares `needs: [build-and-push-image]`, and an `if:`-skipped job would
            # propagate skipped-ness to any dependent whose own gate is later relaxed.
            #
            # workflow_dispatch MUST keep pushing even from a feature branch: `terraform apply` passes
            # -var="docker_tag=sha-${{ github.sha }}", so a suppressed push would point the container app at
            # a tag that was never published.
            - name: Log in to the Container registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  username: awaldow
                  password: ${{ secrets.DOCKER_HUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ matrix.image }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha,format=long
                      type=ref,event=branch

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.contextDir }}
                  file: ${{ matrix.dockerfile }}
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

    terraform:
        name: "Terraform"
        runs-on: ubuntu-latest
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        needs: [build-and-push-image]
        defaults:
            run:
                working-directory: .iac/wayd

        steps:
            - uses: actions/checkout@v4
              name: Checkout

            - uses: hashicorp/setup-terraform@v3
              name: Setup Terraform
              with:
                  terraform_version: "1.14.x"
                  cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

            - name: Terraform Init
              id: init
              run: |
                  terraform init
                  terraform workspace select -or-create wayd-dev
                  terraform workspace show

            - name: Terraform fmt
              id: fmt
              run: terraform fmt -check
              continue-on-error: true

            - name: Terraform Validate
              id: validate
              run: terraform validate -no-color

            - name: Terraform Apply
              id: apply
              run: terraform apply -auto-approve -var="docker_tag=sha-${{ github.sha }}" -var="sql_admin_pass=${{ secrets.SQL_ADMIN_PASSWORD }}" -var="local_jwt_secret=${{ secrets.LOCAL_JWT_SECRET }}" -var="dataprotection_master_key=${{ secrets.DATAPROTECTION_MASTER_KEY }}"

    deploy:
        name: "Deploy"
        runs-on: ubuntu-latest
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        needs: [terraform]
        steps:
            - uses: actions/checkout@v4
              name: Checkout

            - name: Terraform Output
              id: tfoutputs
              uses: dflook/terraform-output@v1
              with:
                  workspace: wayd-dev
                  path: .iac/wayd
              env:
                  TERRAFORM_CLOUD_TOKENS: app.terraform.io=${{ secrets.TF_API_TOKEN }}

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Restore dependencies
              run: dotnet restore

            - name: Install dotnet ef
              run: dotnet tool install --global dotnet-ef

            - name: Build for migrations
              run: dotnet build Wayd.Web/src/Wayd.Web.Api/Wayd.Web.Api.csproj

            - name: Run migrations
              run: |
                  dotnet ef database update --connection "${{ steps.tfoutputs.outputs.sql_server_connection_string }}" --startup-project Wayd.Web/src/Wayd.Web.Api/Wayd.Web.Api.csproj --project Wayd.Infrastructure/src/Wayd.Infrastructure.Migrators.MSSQL/Wayd.Infrastructure.Migrators.MSSQL.csproj
